name: Auto Scrape Water Level Data

on:
  schedule:
    - cron: '*/7 * * * *' # Run every 7 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        working-directory: ./water-level
        run: python scrape.py cleaned_water_level.csv

      - name: Commit and Push Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: auto-update water level data [skip ci]"
          file_pattern: "water-level/cleaned_water_level.csv"
