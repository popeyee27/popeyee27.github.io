name: Auto Scrape Water Level Data

on:
  schedule:
    - cron: '*/7 * * * *' # Run every 7 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper with Retry
        working-directory: ./water-level
        run: |
          MAX_RETRIES=5
          SUCCESS=0
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Pipeline run attempt $i of $MAX_RETRIES..."
            if python scrape.py cleaned_water_level.csv; then
              SUCCESS=1
              break
            fi
            echo "Attempt $i failed (possible 403). Retrying in 10 seconds..."
            sleep 10
          done
          if [ $SUCCESS -ne 1 ]; then
            echo "Error: All $MAX_RETRIES scraper attempts failed."
            exit 1
          fi

      - name: Commit and Push Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water-level/cleaned_water_level.csv
          if ! git diff --staged --quiet; then
            git commit -m "data: auto-update water level data (last 3 days) [skip ci]"
            git push
          else
            echo "Working tree clean. Nothing to commit."
          fi
