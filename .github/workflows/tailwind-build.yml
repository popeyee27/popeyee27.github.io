name: Tailwind CSS Build

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'water-level/index.html'
      - 'water-level/input.css'
      - 'water-level/script.js'
      - 'water-level/package.json'
      - '.github/workflows/tailwind-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./water-level

      - name: Build Tailwind CSS
        run: npm run build
        working-directory: ./water-level

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-build Tailwind CSS [skip ci]"
          file_pattern: "water-level/style.css"
